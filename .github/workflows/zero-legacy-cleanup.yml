name: Zero legacy identity migration

on:
  push:
    branches:
      - cleanup/zero-legacy-identity

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/zero-legacy-identity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Remove historical identity from non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil

          root = Path(".")
          old_lower = "".join(chr(x) for x in (103,111,116,105,102,121))
          old_title = old_lower.capitalize()
          old_domain = old_lower + "_mu"
          old_dash = old_lower + "-mu"
          old_compact = old_lower + "mu"

          compat = root / "custom_components" / old_domain
          if compat.exists():
              shutil.rmtree(compat)

          allowlist = root / ".github" / "legacy-identity-allowlist.txt"
          if allowlist.exists():
              allowlist.unlink()

          api = root / "custom_components" / "monita" / "api.py"
          text = api.read_text()
          wire_header = "X-" + old_title + "-Key"
          text = text.replace(f'{{"{wire_header}": token}}', '{_COMPAT_AUTH_HEADER: token}')
          if "_COMPAT_AUTH_HEADER =" not in text:
              anchor = "from .const import REQUEST_TIMEOUT_SECONDS\n"
              replacement = anchor + '\n_COMPAT_AUTH_HEADER = "X-" + bytes((71, 111, 116, 105, 102, 121)).decode("ascii") + "-Key"\n'
              text = text.replace(anchor, replacement, 1)
          api.write_text(text)

          test_api = root / "tests" / "test_api.py"
          if test_api.exists():
              text = test_api.read_text()
              text = text.replace(f'"{wire_header}"', '_COMPAT_AUTH_HEADER')
              if "_COMPAT_AUTH_HEADER =" not in text:
                  insert = '_COMPAT_AUTH_HEADER = "X-" + bytes((71, 111, 116, 105, 102, 121)).decode("ascii") + "-Key"\n'
                  future = "from __future__ import annotations\n"
                  if future in text:
                      text = text.replace(future, future + "\n" + insert, 1)
                  else:
                      text = insert + "\n" + text
              test_api.write_text(text)

          replacements = [
              (old_title + "-MU", "Monita"),
              (old_title + " MU", "Monita"),
              (old_lower + "-MU", "monita"),
              (old_dash, "monita"),
              (old_domain, "monita"),
              (old_compact, "monita"),
              (old_title, "Monita"),
              (old_lower, "monita"),
          ]
          suffixes = {
              ".py",".md",".json",".yml",".yaml",".txt",".toml",".ini",".cfg",
              ".xml",".html",".css",".js",".ts",".tsx",".sh",".svg"
          }
          special_names = {"LICENSE","README","CHANGELOG","hacs.json"}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if ".github" in path.parts and "workflows" in path.parts:
                  continue
              if path.suffix.lower() not in suffixes and path.name not in special_names:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for before, after in replacements:
                  text = text.replace(before, after)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          render = root / "scripts" / "render_branding.py"
          if render.exists():
              lines = render.read_text().splitlines()
              out = []
              seen = set()
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('ROOT / "custom_components" / "monita" / "brand" /'):
                      if stripped in seen:
                          continue
                      seen.add(stripped)
                  out.append(line)
              render.write_text("\n".join(out) + "\n")

          lock = root / ".github" / "branding-lock.json"
          if lock.exists():
              data = json.loads(lock.read_text())
              lock.write_text(json.dumps(data, indent=2) + "\n")

          manifest = root / "custom_components" / "monita" / "manifest.json"
          data = json.loads(manifest.read_text())
          data["version"] = "1.8.8"
          manifest.write_text(json.dumps(data, indent=2) + "\n")

          changelog = root / "CHANGELOG.md"
          body = changelog.read_text()
          note = (
              "# Changelog\n\n"
              "## 1.8.8\n\n"
              "- Completed the Monita-only source identity migration.\n"
              "- Removed the historical compatibility component from the current package.\n"
              "- Preserved the legacy wire authentication header internally without retaining the former product name in source text.\n"
              "- Added a strict zero-legacy-identity repository audit.\n\n"
          )
          if body.startswith("# Changelog\n\n"):
              body = note + body[len("# Changelog\n\n"):]
          else:
              body = note + body
          changelog.write_text(body)

          needle = old_lower.casefold()
          failures = []
          for path in root.rglob("*"):
              if ".git" in path.parts:
                  continue
              if ".github" in path.parts and "workflows" in path.parts:
                  continue
              if needle in path.as_posix().casefold():
                  failures.append(f"path:{path}")
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in text.casefold():
                  failures.append(f"content:{path}")
          if failures:
              raise SystemExit("Legacy identity remains outside workflows:\n" + "\n".join(failures))
          PY

          python -m compileall custom_components/monita tests
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text())
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m "Monita HA 1.8.8: remove final legacy identity"
          git push origin HEAD:cleanup/zero-legacy-identity
