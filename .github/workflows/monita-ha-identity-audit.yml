name: Monita Home Assistant identity audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject retired product identity outside credit
        shell: bash
        run: |
          set -euo pipefail
          one="$(printf '%s%s' 'go' 'tify')"
          two="$(printf '%s%s%s' 'go' 'tify' '-mu')"
          three="$(printf '%s%s%s' 'go' 'tify' '_mu')"
          four="$(printf '%s%s%s' 'go' 'tify' 'mu')"
          matches="$(git grep -nIi -E "$one|$two|$three|$four" -- . ':!LICENSE' ':!.github/workflows/monita-ha-identity-audit.yml' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Retired product identity remains outside the upstream credit."
            exit 1
          fi
