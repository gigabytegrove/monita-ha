name: Monita Home Assistant identity audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Monita-only current tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          needle = bytes((103, 111, 116, 105, 102, 121)).decode("ascii").casefold()
          failures = []
          for path in Path(".").rglob("*"):
              if ".git" in path.parts:
                  continue
              if needle in path.as_posix().casefold():
                  failures.append(f"path:{path}")
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in text.casefold():
                  failures.append(f"content:{path}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Current tree contains only the Monita identity.")
          PY
