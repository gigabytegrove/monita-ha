name: Monita Home Assistant identity audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject legacy-named paths outside compatibility component
        shell: bash
        run: |
          set -euo pipefail
          legacy_path="$(printf '%s%s%s' 'go' 'tify' '_mu')"
          legacy_dash="$(printf '%s%s%s' 'go' 'tify' '-mu')"
          matches="$(find . -path './.git' -prune -o -type f -print \
            | sed 's#^./##' \
            | grep -Ei "${legacy_path}|${legacy_dash}" \
            | grep -v "^custom_components/${legacy_path}/" || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Legacy HA identity remains in active paths outside the required compatibility component."
            exit 1
          fi

      - name: Reject stale active product branding
        shell: bash
        run: |
          set -euo pipefail
          one="$(printf '%s%s' 'Go' 'tify')"
          matches="$(git grep -nI -E "${one}[ -]MU|${one}-MU" -- . \
            ':!CHANGELOG.md' ':!README.md' ':!docs/**' ':!custom_components/gotify_mu/**' \
            ':!.github/workflows/monita-ha-identity-audit.yml' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Stale predecessor product branding remains in active Monita HA code."
            exit 1
          fi
