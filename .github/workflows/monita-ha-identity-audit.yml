name: Monita Home Assistant identity audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify canonical-only distribution
        shell: bash
        run: |
          set -euo pipefail
          test -f custom_components/monita/manifest.json
          actual="$(find custom_components -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          [[ "$actual" == "monita" ]] || { echo "::error::Noncanonical integration folders: $actual"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("custom_components/monita/manifest.json").read_text())
          assert obj["domain"] == "monita" and obj["name"] == "Monita"
          PY
      - name: Reject retired identifiers in active source
        shell: bash
        run: |
          set -euo pipefail
          old="$(printf '%s%s%s' 'go' 'tify' '_mu')"
          if git grep -nI -- "$old" custom_components/monita scripts tests; then
            echo "::error::Retired identity exists in active source"
            exit 1
          fi
