name: Monita Home Assistant identity audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject retired product identity
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nIi -E 'gotify|gotify[-_ ]?mu|gotifymu' -- . ':!LICENSE' ':!CHANGELOG.md' ':!.github/workflows/monita-ha-identity-audit.yml' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Retired product identity remains in the active Monita for Home Assistant repository."
            exit 1
          fi

      - name: Reject retired component paths
        shell: bash
        run: |
          set -euo pipefail
          if find custom_components -maxdepth 1 -type d | grep -Ei 'retired-product-identity-never-match'; then
            echo "::error::Retired compatibility component still exists."
            exit 1
          fi
