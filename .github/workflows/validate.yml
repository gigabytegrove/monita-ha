name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall custom_components/monita tests
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)
              print(f"OK {path}")
          PY
      - name: Render canonical branding
        run: |
          python -m pip install "CairoSVG==2.8.2"
          python scripts/render_branding.py
      - name: Verify locked branding
        run: python scripts/check_branding.py
      - name: Verify feature documentation
        run: python scripts/check_documentation.py
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check custom_components tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.11.1" "pytest-homeassistant==2026.11.1" "pytest==9.0.3"
          # The custom-component fixture extraction currently pins HA 2026.10;
          # avoid pip backtracking to its 2021 release (pytest 6 is Python 3.14 incompatible).
          python -m pip install --no-deps "pytest-homeassistant-custom-component==0.13.375"
      - name: Run tests
        run: pytest -q
      - name: Home Assistant 2026.11.1 import
        run: python -c "import custom_components.monita; import custom_components.monita.config_flow; import custom_components.monita.native; print('Monita HA imports passed')"
